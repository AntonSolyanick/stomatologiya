name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Build static site
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE: /${{ github.event.repository.name }}/
          # Публичные ключи Supabase (их можно хранить открыто)
          VITE_SUPABASE_URL: https://axgimpkzchlijdxpnwks.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF4Z2ltcGt6Y2hsaWpkeHBud2tzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExNDIwNzMsImV4cCI6MjEwNjcxODA3M30.Twl5aLW0z1IqPdqr93Oev9VlK_UTrcd16OxyxIUgiNI
          VITE_SUPABASE_PROJECT_ID: axgimpkzchlijdxpnwks
        run: bunx vite build
      - name: Prepare SPA files
        run: |
          cp dist/client/_shell.html dist/client/index.html
          cp dist/client/_shell.html dist/client/404.html
          touch dist/client/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
